definitions:
  controller.DocLikeBatch:
    properties:
      items:
        items:
          $ref: '#/definitions/models.LikeState'
        type: array
    type: object
  controller.DocLikeChange:
    properties:
      changed:
        type: boolean
      liked:
        type: boolean
      post_id:
        type: string
      version:
        type: string
    type: object
  controller.ResponseData:
    properties:
      code:
        type: integer
      data: {}
      msg: {}
    type: object
  controller._Response:
    properties:
      code:
        description: 业务响应状态吗
        type: integer
      message:
        description: 提示信息
        type: string
    type: object
  controller._ResponseCommunityDetailList:
    properties:
      code:
        description: 业务响应状态吗
        type: integer
      data:
        description: 数据
        items:
          $ref: '#/definitions/models.CommunityDetail'
        type: array
      message:
        description: 提示信息
        type: string
    type: object
  controller._ResponseCommunityList:
    properties:
      code:
        description: 业务响应状态吗
        type: integer
      data:
        description: 数据
        items:
          $ref: '#/definitions/models.Community'
        type: array
      message:
        description: 提示信息
        type: string
    type: object
  controller._ResponsePostList:
    properties:
      code:
        description: 业务响应状态吗
        type: integer
      data:
        description: 数据
        items:
          $ref: '#/definitions/models.ApiPostDetail'
        type: array
      message:
        description: 提示信息
        type: string
    type: object
  controller.batchLikeRequest:
    properties:
      post_ids:
        items:
          type: string
        type: array
    type: object
  models.ApiPostDetail:
    properties:
      author_id:
        type: integer
      author_id_str:
        type: string
      author_name:
        type: string
      community_id:
        type: integer
      content:
        type: string
      create_time:
        type: string
      id:
        type: integer
      introduction:
        type: string
      name:
        type: string
      status:
        type: integer
      title:
        type: string
      update_time:
        type: string
      vote_num:
        type: integer
    required:
    - community_id
    - content
    - title
    type: object
  models.Community:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.CommunityDetail:
    properties:
      create_time:
        type: string
      id:
        type: integer
      introduction:
        type: string
      name:
        type: string
    type: object
  models.LikeState:
    properties:
      code:
        type: integer
      freshness:
        type: string
      liked:
        type: boolean
      post_id:
        type: string
      source:
        type: string
      version:
        type: string
    type: object
  models.ParamsCreatePost:
    properties:
      community_id:
        type: integer
      content:
        maxLength: 8192
        type: string
      title:
        maxLength: 128
        type: string
    required:
    - community_id
    - content
    - title
    type: object
  models.ParamsLogin:
    properties:
      password:
        type: string
      username:
        maxLength: 32
        type: string
    required:
    - password
    - username
    type: object
  models.ParamsSignUp:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
      re_password:
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - re_password
    - username
    type: object
  models.ParamsUpdatePost:
    properties:
      content:
        maxLength: 8192
        type: string
      title:
        maxLength: 128
        type: string
    required:
    - content
    - title
    type: object
  models.ParamsVoteData:
    properties:
      direction:
        description: 点赞/取消，旧 -1 明确拒绝
        enum:
        - '1'
        - '0'
        example: '0'
        type: string
      post_id:
        description: UserID 从请求中获取当前的用户
        example: '0'
        type: string
    required:
    - post_id
    type: object
host: 127.0.0.1:9090/api/v1
info:
  contact:
    email: 330459539@qq.com
    name: scut2024hjt
  description: Go web 开发进阶项目实战 --> 源自李文周
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: convo 项目接口文档
  version: '1.0'
paths:
  /community:
    get:
      consumes:
      - application/json
      description: 获取社区详情接口
      parameters:
      - description: Bearer 用户令牌
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller._ResponseCommunityList'
      security:
      - ApiKeyAuth: []
      summary: 获取社区详情接口
      tags:
      - 社区相关接口
  /community/:id:
    get:
      consumes:
      - application/json
      description: 获取社区分类详情接口
      parameters:
      - description: Bearer 用户令牌
        in: header
        name: Authorization
        type: string
      - description: 社区 id 参数
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller._ResponseCommunityDetailList'
      security:
      - ApiKeyAuth: []
      summary: 获取社区分类详情接口
      tags:
      - 社区相关接口
  /login:
    post:
      consumes:
      - application/json
      description: 用户登录请求接口
      parameters:
      - description: Bearer 用户令牌
        in: header
        name: Authorization
        type: string
      - description: 登录参数
        in: body
        name: object
        schema:
          $ref: '#/definitions/models.ParamsLogin'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller.ResponseData'
      security:
      - ApiKeyAuth: []
      summary: 用户登录请求接口
      tags:
      - 用户相关接口
  /logout:
    post:
      parameters:
      - description: Bearer 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller.ResponseData'
      security:
      - ApiKeyAuth: []
      summary: 退出登录接口
      tags:
      - 用户相关接口
  /post:
    post:
      consumes:
      - application/json
      description: 创建帖子接口
      parameters:
      - description: Bearer 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      - description: 创建帖子参数
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/models.ParamsCreatePost'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller.ResponseData'
      security:
      - ApiKeyAuth: []
      summary: 创建帖子接口
      tags:
      - 帖子相关接口
  /post/{id}:
    get:
      consumes:
      - application/json
      description: 获取帖子详情接口
      parameters:
      - description: 帖子 id 参数
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller._ResponsePostList'
      summary: 获取帖子详情接口
      tags:
      - 帖子相关接口
    put:
      consumes:
      - application/json
      parameters:
      - description: Bearer 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      - description: 帖子 id
        in: path
        name: id
        required: true
        type: string
      - description: 编辑帖子参数
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/models.ParamsUpdatePost'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller.ResponseData'
      security:
      - ApiKeyAuth: []
      summary: 编辑帖子接口
      tags:
      - 帖子相关接口
  /post/{id}/like:
    delete:
      description: 幂等设为未点赞；保留历史版本。
      parameters:
      - description: 帖子 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/controller.DocLikeChange'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 取消点赞
      tags:
      - 点赞
    get:
      description: source=mysql/freshness=persisted 表示可能滞后的已持久化状态。
      parameters:
      - description: 帖子 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.LikeState'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 查询本人点赞状态
      tags:
      - 点赞
    put:
      description: 幂等设为已点赞；成功表示 Redis 状态及事件已接受，MySQL 异步持久化。
      parameters:
      - description: 帖子 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/controller.DocLikeChange'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 点赞
      tags:
      - 点赞
  /posts:
    get:
      consumes:
      - application/json
      description: 分页查询帖子列表接口
      parameters:
      - description: Bearer 用户令牌
        in: header
        name: Authorization
        type: string
      - description: 查询参数
        in: query
        name: page
        type: string
      - description: 查询参数
        in: query
        name: size
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller._ResponsePostList'
      security:
      - ApiKeyAuth: []
      summary: 基础版帖子列表接口
      tags:
      - 帖子相关接口
  /posts/like-states:
    post:
      consumes:
      - application/json
      description: 去重后最多 50 个 ID，原始数组最多 500 项、请求体最多 16KiB。不可见条目带业务 code。
      parameters:
      - description: 帖子 ID 列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.batchLikeRequest'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/controller.DocLikeBatch'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 批量查询本人点赞状态
      tags:
      - 点赞
  /posts2:
    get:
      consumes:
      - application/json
      description: 可按社区按时间或分数排序查询帖子列表接口
      parameters:
      - description: Bearer 用户令牌
        in: header
        name: Authorization
        type: string
      - description: 可以为空
        in: query
        name: community_id
        type: integer
      - in: query
        name: order
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller._ResponsePostList'
      security:
      - ApiKeyAuth: []
      summary: 升级版帖子列表接口
      tags:
      - 帖子相关接口
  /signup:
    post:
      consumes:
      - application/json
      description: 用户注册请求接口
      parameters:
      - description: 注册参数
        in: body
        name: object
        schema:
          $ref: '#/definitions/models.ParamsSignUp'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller._Response'
      security:
      - ApiKeyAuth: []
      summary: 用户注册请求接口
      tags:
      - 用户相关接口
  /vote:
    post:
      consumes:
      - application/json
      description: 仅支持 direction 字符串 0/1；负票返回参数错误。与新点赞接口共用状态和限流。
      parameters:
      - description: Bearer 用户令牌
        in: header
        name: Authorization
        required: true
        type: string
      - description: 投票参数
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/models.ParamsVoteData'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/controller.ResponseData'
      security:
      - ApiKeyAuth: []
      summary: 点赞兼容接口
      tags:
      - 投票相关接口
swagger: '2.0'
