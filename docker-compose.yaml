services:
  redis507:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "36379:6379"
    volumes:
      - redis_data:/data

  mysql8019:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "33306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "convo"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: convo
      RABBITMQ_DEFAULT_PASS: convo
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  convo_app:
    build:
      context: .
      args:
        # 默认官方源；国内可用 CONVO_GOPROXY=https://goproxy.cn,direct 覆盖
        GOPROXY: ${CONVO_GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    command: ["./wait-for.sh", "redis507:6379", "mysql8019:3306", "rabbitmq:5672", "--", "./convo_app"]
    depends_on:
      - mysql8019
      - redis507
      - rabbitmq
    environment:
      CONVO_MYSQL_HOST: mysql8019
      CONVO_MYSQL_PORT: "3306"
      CONVO_MYSQL_PASSWORD: "123456"
      CONVO_REDIS_HOST: redis507
      CONVO_REDIS_PORT: "6379"
      CONVO_RABBITMQ_URL: amqp://convo:convo@rabbitmq:5672/
      CONVO_AUTH_JWT_SECRET: local-compose-secret-change-before-production
      CONVO_SNOWFLAKE_MACHINE_ID: "1"
    ports:
      - "9090:9090"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
